<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background: #f4f6f8; 
            color: #333; 
        }
        h1 { text-align: center; color: #2c3e50; }
        h2 { text-align: center; color: #2c3e50; margin-top: 30px; }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .card img { 
            width: 55%; 
            max-width: 280px;
            height: auto; 
            display: block; 
            margin: 0 auto; 
            border-radius: 6px; 
        }

        /* Форма добавления todo */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        .todo-form input {
            flex: 1;
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #4caf50;
            border-radius: 4px;
            outline: none;
        }
        .todo-form input:focus {
            border-color: #388e3c;
        }
        .todo-form button {
            padding: 12px 25px;
            font-size: 1em;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .todo-form button:hover {
            background: #43a047;
        }
        .char-counter {
            text-align: right;
            font-size: 0.8em;
            color: #7f8c8d;
            margin-top: 4px;
        }

        /* Список todo */
        ul.todos {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
        }
        ul.todos li {
            background: #eef1f3;
            border-left: 5px solid #4caf50;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .port-info { 
            text-align: center; 
            color: #7f8c8d; 
            font-size: 0.9em; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <h1>Todo App</h1>
    <div class="card">
        <img src="/image" alt="Random bear">

        <!-- Форма: input + кнопка Send -->
        <form class="todo-form" id="todo-form">
            <input
                type="text"
                id="todo-input"
                maxlength="140"
                placeholder="Enter a new todo (max 140 characters)"
                autocomplete="off"
            >
            <button type="submit">Send</button>
        </form>
        <div class="char-counter"><span id="char-count">0</span>/140</div>

        <!-- Список todo: отрендерен на сервере (todo-app -> todo-backend) -->
        <h2>Todos</h2>
        <ul class="todos" id="todo-list">
            {todo_items}
        </ul>
    </div>
    <p class="port-info">DevOps with Kubernetes 2026 · port <strong>{port}</strong></p>

    <script>
        const form = document.getElementById('todo-form');
        const input = document.getElementById('todo-input');
        const counter = document.getElementById('char-count');

        // Куда БРАУЗЕР постит новый todo (Ingress маршрутизирует в todo-backend)
        const TODO_POST_URL = '{todos_post_url}';

        // Счётчик символов под полем ввода
        input.addEventListener('input', () => {
            counter.textContent = input.value.length;
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();  // отменяем стандартную отправку формы

            const text = input.value.trim();

            // Защита на клиенте: не принимаем todo длиннее 140 символов
            if (!text || text.length > 140) {
                return;
            }

            try {
                const resp = await fetch(TODO_POST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || ('HTTP ' + resp.status));
                }

                // Перезагружаем страницу: todo-app заново отрендерит список с бэкенда
                window.location.reload();
            } catch (err) {
                alert('Failed to create todo: ' + err.message);
            }
        });
    </script>
</body>
</html>
