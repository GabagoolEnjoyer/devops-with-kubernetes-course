apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-deployment
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: todo-app:1.5
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "6666"
        - name: CACHE_DIR
          value: /usr/src/app/files/
        - name: CACHE_TTL
          value: "600"
        - name: TODOS_URL
          value: http://todo-backend-service:8888
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"  # Maximum memory allowed
            cpu: "200m"      # Maximum CPU allowed
          requests:
            memory: "128Mi"  # Initial memory request
            cpu: "100m"  
      
